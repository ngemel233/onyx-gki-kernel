name: Build GKI 6.6.118 Exact KMI (KSU-Next v3.4.2 + Droidspaces)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 unzip wget zip zstd lz4

      - name: Setup Repo Tool & Clone GKI 6.6 Source
        run: |
          mkdir -p ~/bin && curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          mkdir kernel_build && cd kernel_build
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Pin Kernel Version to 6.6.118 (Exact KMI Match)
        run: |
          cd kernel_build/common
          COMMIT_118=$(git log --grep="6.6.118" --format="%H" -n 1)
          if [ -n "$COMMIT_118" ]; then
            git checkout $COMMIT_118
          else
            sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/' Makefile
          fi
          rm -f localversion*
          echo "-android15-8-g0908354dac1b-ab16143355-4k" > localversion

      - name: Integrate KernelSU-Next v3.4.2
        run: |
          cd kernel_build/common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.4.2

      - name: Enable Droidspaces & KSU Configs
        run: |
          cd kernel_build/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          cat << 'EOF' >> $DEFCONFIG
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_FUSE_FS=y
          CONFIG_TUN=y
          CONFIG_BRIDGE=y
          CONFIG_VETH=y
          # CONFIG_USER_NS is not set
          EOF

      - name: Build Kernel Image.gz
        run: |
          cd kernel_build
          CLANG_DIR=$(find "$PWD/prebuilts/clang/host/linux-x86" -maxdepth 1 -name "clang-r*" | sort -V | tail -n 1)
          BUILD_TOOLS_DIR="$PWD/prebuilts/kernel-build-tools/linux-x86/bin"
          export PATH="$CLANG_DIR/bin:$BUILD_TOOLS_DIR:$PATH"
          cd common
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config --file out/.config -d DEBUG_INFO_BTF
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image.gz

      - name: Package AnyKernel3 for POCO F7 (onyx)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel_build/common/out/arch/arm64/boot/Image.gz AnyKernel3/
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=GKI 6.6.118 (KSU-Next v3.4.2 + Droidspaces)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=onyx
          '; }
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          cd AnyKernel3
          zip -r9 ../GKI-6.6.118-KSUNext3.4.2-Droidspaces.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6.118-KSUNext3.4.2-Droidspaces
          path: GKI-6.6.118-KSUNext3.4.2-Droidspaces.zip
          
